services:
  - type: web
    name: tutorial-hub
    runtime: node
    repo: https://github.com/utilora/tutorial-hub
    branch: main
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: tutorial-data
      mountPath: /var/data
      sizeGB: 1
